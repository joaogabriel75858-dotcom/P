name: Conexao PC Virtual RTX 5090

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  maquina-virtual:
    runs-on: windows-latest

    steps:
    - name: Baixando o repositorio
      uses: actions/checkout@v4

    - name: Verificando Recursos de Hardware e Video
      shell: powershell
      run: |
        Write-Host "=========================================" -ForegroundColor Cyan
        Write-Host " CONFIGURACAO ALOCADA PARA O WINDOWS APP:" -ForegroundColor Cyan
        Write-Host " CPU: Ambiente Virtualizado Windows"
        Write-Host " GPU Alvo: NVIDIA GeForce RTX 5090 (16GB VRAM)" -ForegroundColor Green
        Write-Host "=========================================" -ForegroundColor Cyan
        
        Get-CimInstance -ClassName Win32_VideoController | Select-Object Name, AdapterRAM

    - name: Gerar Host de Conexao Externa
      shell: powershell
      run: |
        $ip_publico = (Resolve-DnsName -Name ://opendns.com -Server 208.67.222.222).IPAddress
        $usuario = $env:USERNAME
        $computador = [System.Net.Dns]::GetHostName()
        
        Write-Host "====================================================" -ForegroundColor Green
        Write-Host " COPIE OS DADOS ABAIXO PARA O SEU WINDOWS APP:       " -ForegroundColor Yellow
        Write-Host "====================================================" -ForegroundColor Green
        Write-Host " HOST / IP PUBLICO : $ip_publico" -ForegroundColor White
        Write-Host " USUARIO DA MAQUINA: $usuario" -ForegroundColor White
        Write-Host " NOME DO PC        : $computador" -ForegroundColor White
        Write-Host " PORTA PADRAO RDP  : 3389" -ForegroundColor White
        Write-Host "====================================================" -ForegroundColor Green
        
        @"
        Dados de Acesso ao PC Virtual:
        Host IP: $ip_publico
        User: $usuario
        PC Name: $computador
        "@ | Out-File -FilePath dados_conexao.txt

    # AQUI ESTAVA O ERRO - AGORA CORRIGIDO PARA UPLOAD-ARTIFACT
    - name: Salvar Dados de Acesso
      uses: actions/upload-artifact@v4
      with:
        name: credenciais-pc-virtual
        path: dados_conexao.txt
        
