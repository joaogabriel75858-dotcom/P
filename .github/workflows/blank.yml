name: Conexao PC Virtual RTX 5090

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  maquina-virtual:
    runs-on: windows-latest

    steps:
    - name: Baixando o repositorio
      uses: actions/checkout@v4

    - name: Configurando Senha do PC
      shell: powershell
      run: |
        # Define a senha para a sua conexao
        $Password = ConvertTo-SecureString "SenhaSegura123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        
        # Libera o acesso remoto no Windows
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Abrindo Conexao Direta para o Celular
      uses: mxschmitt/action-tmate@v3
      
